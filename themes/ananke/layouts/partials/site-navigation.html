<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex-l center items-center justify-between">
    <!-- Logo 或站点标题 -->
    <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-white white-90 dib no-underline" aria-label="Home">
      {{ with .Site.Params.site_logo }}
        <img src="{{ urls.RelURL . }}" class="w100 mw5-ns" alt="{{ $.Site.Title }}" />
      {{ else }}
        {{ .Site.Title }}
      {{ end }}
    </a>

    <!-- 汉堡菜单按钮，仅在小屏幕显示 -->
    <button class="menu-toggle dib dn-l" aria-label="Toggle navigation">
      <span class="menu-icon"></span>
    </button>

    <!-- 导航菜单项 -->
    <div class="flex-l items-center">
      <!-- 语言切换部分 -->
      {{ partials.Include "i18nlist.html" . }}

      <!-- 主菜单，仅在大屏幕显示 -->
      {{ if .Site.Menus.main }}
        <ul class="menu-list {{ compare.Conditional (compare.Eq $.Site.Language.LanguageDirection "rtl") "pr0 ml3" "pl0 mr3" }} dn db-l">
          {{ range .Site.Menus.main }}
            <li class="list f5 f4-ns fw4 dib {{ compare.Conditional (compare.Eq $.Site.Language.LanguageDirection "rtl") "pl3" "pr3" }}">
              <a class="hover-white white-90 no-underline" href="{{ .URL }}" title="{{ lang.Translate "pageTitle" . }}" aria-label="{{ .Name }}">
                {{ .Name }}
              </a>
            </li>
          {{ end }}
        </ul>
      {{ end }}

      <!-- 社交媒体链接 -->

    </div>
  </div>
</nav>

<!-- 小屏幕汉堡菜单的样式和脚本 -->
<script>
  // 使汉堡菜单按钮可切换显示
  document.querySelector('.menu-toggle').addEventListener('click', function() {
    document.querySelector('.menu-list').classList.toggle('dn');
  });
</script>

<style>
  /* 隐藏大屏幕的汉堡菜单按钮 */
  .menu-toggle {
    display: none;
  }

  /* 小屏幕时菜单项隐藏 */
  .menu-list {
    display: flex;
    flex-direction: row;
    margin: 0;
    padding: 0;
  }

  /* 小屏幕时显示汉堡菜单 */
  @media (max-width: 768px) {
    .menu-list {
      display: none;
      flex-direction: column;
      width: 100%;
      background-color: #333;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px;
    }

    .menu-toggle {
      display: block;
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .menu-icon {
      display: block;
      width: 30px;
      height: 3px;
      background-color: white;
      margin: 6px auto;
    }

    .menu-list.dn {
      display: none;
    }
  }
</style>
