baseurl = "https://www.adsmed.org/" 
# Configure URL. if using gh-pages https://github.com/<username>/hugo-universal-theme URL: https://<username>.github.io/hugo-universal-theme/
title = "爱得生三代试管中心"
theme = 'universal'
#themesDir = "../.."
resourceDir = "../resources"
languageCode = "zh-cn"
# Site language. Available translations in the theme's `/i18n` directory.
defaultContentLanguage = "zh"

# 定义自动生成文章摘要时的字数，这里是 70 个单词
summaryLength = 70

# 禁用对列表页（如文章列表页）标题的复数化处理
pluralizelisttitles = false

enableRobotsTXT = false

