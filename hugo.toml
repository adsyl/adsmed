[params]
    viewMorePostLink = "/blog/"  #指向“查看更多文章”链接的地址。
    author = "adsmed"
    defaultKeywords = ["爱得生", "试管", "三代", "三代试管", "特殊试管", "高龄试管", "拉拉试管"]   #用于 SEO 的默认关键词
    mainSections = ["blog"]
    defaultDescription = "ADSMed面向特殊试管需求客户提供定制化的试管辅助服务"  #用于 SEO 的默认描述

    # Social media
    facebook_site = "" # the Facebook handle of your site ('https://www.facebook.com/HANDLE')
    twitter_site = "GoHugoIO" # the Twitter handle of your site (without the '@')
    default_sharing_image = "img/sharing-default.png"

    # Style options: default (light-blue), blue, green, marsala, pink, red, turquoise, violet
    style = "pink"

    # Since this template is static, the contact form uses www.formspree.io as a
    # proxy. The form makes a POST request to their servers to send the actual
    # email. Visitors can send up to a 50 emails each month for free.
    #
    # What you need to do for the setup?
    #
    # - register your account to https://formspree.io/register
    # - login and create new form
    # - set your form's endpoint url under 'formspree_action' below
    # - upload the generated site to your server
    # - test a dummy email yourself
    # - you're done. Happy mailing!
    #
    # Enable the contact form by entering your Formspree.io endpoint url
    formspree_action = "https://formspree.io/sample/of/endpoint"
    contact_form_ajax = false


    
    enableRecaptchaInContactForm = false
    googleRecaptchaKey = "site_key_for_google_recaptcha"

    about_us = "<p>一家专业的三代试管服务商，专注于用心服务，以口碑赢得未来.</p>"
    copyright = "Copyright (c) 2015 - 2026, 爱得生医疗; All Rights Reserved."

    # Format dates with Go's time formatting
    date_format = "2006/02/01"
   

  dropdown_mouse_over = false  #false网站下拉菜单通过点击来展开，true通过鼠标悬停。

    disabled_logo = false
    logo_text = "爱得生医疗"
    logo = "img/logo.png"
    logo_small = "img/logo1.png"
    contact_url = "/contact/"
    address = """<p class="text-uppercase"><strong>爱得生医疗</strong>
        <br><strong>中国 武汉</strong>
      </p>
      """

[permalinks]
    blog = "/blog/:contentbasename/"

# Enable or disable top bar with social icons
[params.topbar]
    enable = true
    text = """<p style="font-size: 1.2em;"  class="hidden-sm hidden-xs ">Tel (86)156-2931-5964 </p>
      <p class="hidden-md hidden-lg"><a href="tel:+86 156-2931-5964" data-animate-hover="pulse"><i class="fas fa-phone  fa-2x"></i></a>
          </p>
      """

# Enable and disable widgets for the right sidebar
[params.widgets]
    categories = true      #侧边栏中显示一个列表，列出你网站上的所有文章分类
    tags = true            #侧边栏中显示一个列表，列出你网站上的所有文章标签
    search = true          #侧边栏中显示一个搜索框，让用户可以搜索网站内容。

#用于配置网站上的**客户轮播图（carousel）**功能的参数组
[params.carouselCustomers]
    items = 6
    auto_play = false   #true轮播图自动滚动，false手动点击导航按钮查看下一组项目
    slide_speed = 2000
    pagination_speed = 1000

#专门用于设置网站上推荐语（用户评价）展示区域的轮播图行为的参数组
[params.carouselTestimonials]
    items = 4
    auto_play = false
    slide_speed = 2000
    pagination_speed = 1000

#配置网站菜单下方轮换图的显示方式
[params.carouselHomepage]
    # All carousel items are defined in their own files. You can find example items
    # at 'exampleSite/data/carousel'.
    enable = true
    auto_play = true
    slide_speed = 2000
    pagination_speed = 1000

#配置网站**特色功能（features）**区块的显示方式。
[params.features]
    enable = true
    cols = 3 # Default: 3, Available values 2,3,4,6
    # All features are defined in their own files. You can find example items at 'exampleSite/data/features'

#配置网站**客户评价（testimonials）**区块的显示内容。
[params.testimonials]
    enable = true
    # All testimonials are defined in their own files. You can find example items at 'exampleSite/data/testimonials'
    # For more information take a look at the README.
    title = "推荐"
    subtitle = "我们与许多客户合作过，我们总是希望听到他们从合作中得到快乐和满意。看看我们的客户对我们的评价。"

#配置网站**更多（see_more）**区块的显示内容。
[params.see_more]
    enable = true
    icon = "far fa-file"
    title = "您想了解更多吗?"
    subtitle = "我们提供了一些有用的自评工具和宣教信息供您浏览参考，以便您了解更多。"
    link_url = "/service/tools/"
    link_text = "点击到其他主页"

#配置网站**最新消息（recent_posts）**区块的显示内容。
[params.recent_posts]
    enable = true
    title = "最新消息"
    subtitle = "查看我们最新发布的博客文章，了解更多行业洞见和动态。"
    hide_summary =true   #true 隐藏摘要，只显示文章标题和可能的日期或作者信息

[params.footer.recent_posts]
    enable = true

[taxonomies]
    category = "categories"
    tag = "tags"
    author = "authors"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"