{{ $chartJS := resources.Get "js/chart.min.js" | minify | fingerprint }}
{{ $pgtEngine := resources.Get "js/pgt-engine.js" | minify | fingerprint }}

<script src="{{ $chartJS.RelPermalink }}" integrity="{{ $chartJS.Data.Integrity }}"></script>
<script src="{{ $pgtEngine.RelPermalink }}" integrity="{{ $pgtEngine.Data.Integrity }}"></script>

<div class="flex-grow container mx-auto px-4 py-10 max-w-3xl">
        <section class="glass-card rounded-[2.5rem] p-8 md:p-12 mb-10">
        <form id="pgtForm" style="display: grid; gap: 15px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="number" id="age" placeholder="年龄" required style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <input type="number" id="amh" placeholder="AMH" step="0.1" required style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <input type="number" id="afc" placeholder="AFC" required style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <input type="number" id="fsh" placeholder="FSH" step="0.1" required style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <input type="number" id="lh" placeholder="LH" step="0.1" required style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <input type="number" id="e2" placeholder="E2" step="0.1" required style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <input type="number" id="heightCm" placeholder="身高(cm)" required style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <input type="number" id="weightKg" placeholder="体重(kg)" step="0.1" required style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
            </div>
            <select id="uterineCondition" style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <option value="normal">子宫正常</option>
                <option value="adenomyosis_endo">腺肌症/内异症</option>
            </select>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <select id="liveBirthsCount" style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;"><option value="0">0次活产</option><option value="1">1次活产</option></select>
                <select id="miscarriageCount" style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;"><option value="0">0次流产</option><option value="1">1次流产</option></select>
            </div>
            <input type="hidden" id="otherMedicalHistory" value="none">
            <button type="submit" style="width: 100%; background: #fb7185; color: white; padding: 15px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 16px;">开始临床精算评估</button>
        </form>
    </section>

    <div id="results" style="display:none; margin-top: 30px; padding: 30px; background: #f9fafb; border-radius: 20px;">
        <h2 style="color: #fb7185; font-size: 32px; font-weight: 900; margin-bottom: 10px;" id="lbrDisplay">--%</h2>
        <p id="cycleDisplay" style="color: #4b5563; font-weight: bold; margin-bottom: 20px;"></p>
        <div style="background: white; padding: 15px; border-radius: 15px;">
            <canvas id="funnelChart"></canvas>
        </div>
        <div id="expertReportContent" style="margin-top: 25px; color: #374151; line-height: 1.6;"></div>
    </div>
</div>

<script type="text/javascript">
(function() {
    let myChart = null;

    const handleForm = function(e) {
        e.preventDefault();
        
        if (!window.PGTEngine) {
            alert("精算引擎未加载，请刷新页面。");
            return;
        }

        const dataObj = {
            age: parseInt(document.getElementById('age').value) || 0,
            amh: parseFloat(document.getElementById('amh').value) || 0,
            afc: parseInt(document.getElementById('afc').value) || 0,
            fsh: parseFloat(document.getElementById('fsh').value) || 0,
            lh: parseFloat(document.getElementById('lh').value) || 0,
            e2: parseFloat(document.getElementById('e2').value) || 0,
            uterine: document.getElementById('uterineCondition').value,
            liveBirth: parseInt(document.getElementById('liveBirthsCount').value) || 0,
            miscarriage: parseInt(document.getElementById('miscarriageCount').value) || 0,
            otherMedicalHistory: "none",
            height: parseFloat(document.getElementById('heightCm').value) || 160,
            weight: parseFloat(document.getElementById('weightKg').value) || 55
        };

        try {
            const res = window.PGTEngine.run(dataObj);
            document.getElementById('results').style.display = 'block';
            document.getElementById('lbrDisplay').innerText = res.lbr.toFixed(1) + "%";
            document.getElementById('cycleDisplay').innerText = "方案建议：" + res.opu + " 次促排周期 / " + res.tx + " 次移植周期";
            
            document.getElementById('expertReportContent').innerHTML = 
                '<div style="border-left: 4px solid #fb7185; padding-left: 15px;">' +
                '<p><b>数据解读：</b> 种子评分 ' + res.score + '，预估健康胚胎 ' + res.euploids.toFixed(1) + ' 枚。</p>' +
                '<p><b>临床规划：</b> 为了达成 85% 累计成功率，建议积攒 ' + res.req.toFixed(1) + ' 枚健康胚胎。</p>' +
                '</div>';

            const ctx = document.getElementById('funnelChart').getContext('2d');
            if (myChart) { myChart.destroy(); }
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['获卵', '成胚', '囊胚', '健康'],
                    datasets: [{ data: [res.eggs, res.eggs*0.75, res.blasts, res.euploids], backgroundColor: '#fb7185' }]
                },
                options: { indexAxis: 'y', plugins: { legend: { display: false } } }
            });
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        } catch (err) {
            console.error(err);
        }
    };

    const init = function() {
        const form = document.getElementById('pgtForm');
        if (form) { form.addEventListener('submit', handleForm); }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
