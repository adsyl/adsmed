<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>试管生育力评估系统 - ADSMed</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root { --med-blue: #2c3e50; --med-pink: #d63384; --ok: #27ae60; --warn: #f39c12; --crit: #e74c3c; --soft-bg: #f4f7f6; }
        * { box-sizing: border-box; }
        body { background: var(--soft-bg); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; display: flex; min-height: 100vh; flex-direction: column; }

        .app-container { display: flex; width: 100%; min-height: 100vh; }

         
        .sidebar { width: 440px; background: white; border-right: 1px solid #e2e8f0; flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px; background: var(--med-blue); color: white; }
        .sidebar-body { padding: 20px; overflow-y: auto; }

         
        .main-display { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; }

         
        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; }
            .main-display { padding: 15px; width: 100%; }
            .report-paper { padding: 20px 10px !important; }
        }

         
        .group-card { background: #fff; border: 1px solid #eef2f7; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .group-title { font-weight: bold; color: var(--med-blue); margin-bottom: 15px; border-left: 5px solid var(--med-pink); padding-left: 10px; font-size: 16px; }
        .input-row { margin-bottom: 15px; }
        .input-row label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; }
        .input-row input, .input-row select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 16px; }

         
        .report-paper { width: 100%; max-width: 900px; background: white; padding: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border-radius: 4px; display: none; margin-bottom: 40px; }
        .report-header { text-align: center; border-bottom: 3px solid var(--med-blue); padding-bottom: 10px; margin-bottom: 15px; }


        .section-box { margin-bottom: 40px; }
        .section-title { font-size: 18px; color: var(--med-blue); border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; }
        
         
        .analysis-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; table-layout: fixed; }
        .analysis-table th { background: #f8fafc; text-align: left; padding: 12px; font-size: 13px; color: #64748b; }
        .analysis-table td { padding: 15px 10px; border-bottom: 1px solid #f1f5f9; font-size: 14px; line-height: 1.2; vertical-align: middle; }
    
         
        .analysis-table td:last-child { text-align: left; line-height: 1.6;}   
        

        .val-hl { font-weight: bold; color: var(--med-pink); font-family: "Monaco", monospace; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; color: white; font-weight: bold; }
        .bg-ok { background: var(--ok); } .bg-warn { background: var(--warn); } .bg-crit { background: var(--crit); }

        .advice-card { background: #f0f7ff; border-left: 6px solid #3182ce; padding: 30px; border-radius: 8px; color: #2a4365; margin-top: 20px; }
        .advice-card h4 { margin-top: 0; color: #2b6cb0; border-bottom: 1px solid #bee3f8; padding-bottom: 10px; font-size: 18px; }

        .btn-run { background: var(--med-pink); color: white; border: none; width: 100%; padding: 20px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(214, 51, 132, 0.2); }
        .btn-run:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(214, 51, 132, 0.3); }

         
        .report-footer-watermark { margin-top: 10px; padding-top: 20px;text-align: center;border-top: 1px solid #edf2f7;  }

        .footer-content {  display: flex; flex-direction: column; align-items: center; 
             opacity: 0.3;  
             filter: grayscale(100%);  
         }

        .footer-content img { height: 45px; width: auto; margin-bottom: 8px;}

        .footer-content span { font-size: 12px; color: var(--med-blue); letter-spacing: 2px; text-transform: uppercase;}

    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0;">ADSMed试管生育力评估系统</h2>
            <small>ADSMed Clinical Fertility Assessment System v10.0</small>
        </div>

        <div class="sidebar-body">
            <div class="group-card">
                <div class="group-title">1. 基础信息</div>
                <div class="input-row"><label>姓名 (缩写)</label><input type="text" id="v_name" value="ZMM"></div>
                <div class="input-row"><label>年龄 (岁)</label><input type="number" id="v_age" value="32"></div>
                <div class="input-row"><label>身高 (cm)</label><input type="number" id="v_height" step="1" value="160"></div>
                <div class="input-row"><label>体重 (kg)</label><input type="number" id="v_weight" step="0.5" value="55"></div>
                <div class="input-row"><label>血型</label>
                    <select id="s_blood">
                        <option value="A">A型</option>
                        <option value="B">B型</option>
                        <option value="AB">AB型</option>
                        <option value="O">O型</option>
                    </select>         
                </div>
                <div class="input-row"><label>既往生育史</label>
                    <select id="s_history">
                        <option value="0">未生育</option>
                        <option value="1">1孩</option>
                        <option value="2">2孩及以上</option>
                        <option value="3">原发不孕</option>                       
                    </select></div>             
                <div class="input-row"><label>既往流产史</label>
                    <select id="s_flow">
                        <option value="0">无流产史</option>
                        <option value="1">1次</option>
                        <option value="2">2次</option>
                        <option value="3">3次及以上</option>
                    </select></div>  
             </div>

            <div class="group-card">
                <div class="group-title">2. 卵巢储备与宫腔环境</div>
                <div class="input-row"><label>AFC (双侧窦卵泡数)</label><input type="number" id="v_afc" value="10"></div>
                <div class="input-row"><label>AMH (ng/mL)</label><input type="number" id="v_amh" step="0.01" value="2.5"></div>
                <div class="input-row"><label>促卵泡生成素 FSH (mIU/mL)</label><input type="number" id="v_fsh" step="0.1" value="7.5"></div>
                <div class="input-row"><label>黄体生成素 LH (mIU/mL)</label><input type="number" id="v_lh" value="4.0"></div>
                <div class="input-row"><label>雌二醇 E2 (pg/mL)</label><input type="number" id="v_e2" value="40"></div>
                <div class="input-row"><label>泌乳素 PRL (ng/mL)</label><input type="number" id="v_prl" value="15"></div> 
                <div class="input-row"><label>阴道B超 (内膜/占位)</label>
                    <select id="v_ultra">
                        <option value="0">正常(三线征明显)</option>
                        <option value="1">内膜息肉/粘连/不均</option>
                        <option value="2">子宫肌瘤/腺肌症</option>
                    </select></div>
             </div>
           
            <div class="group-card">
                <div class="group-title">3. 全身健康状态</div>
                <div class="input-row"><label>TSH (促甲状腺激素)</label><input type="number" id="v_tsh" step="0.01" value="2.1"></div>              
                <div class="input-row"><label>血糖</label>
                      <select id="v_blood_sugar">
                        <option value="0">正常</option>
                        <option value="1">异常</option>                      
                    </select></div>  
                <div class="input-row"><label>凝血</label> 
                      <select id="v_blood_coagulation">
                        <option value="0">正常</option>
                        <option value="1">异常</option>                      
                    </select></div>                                                
                <div class="input-row"><label>血脂</label>
                      <select id="v_lipid">
                        <option value="0">正常</option>
                        <option value="1">异常</option>                      
                    </select></div>            
                <div class="input-row"><label>肝肾功能</label>
                      <select id="v_liver_kidney">
                        <option value="0">正常</option>
                        <option value="1">异常</option>                      
                    </select></div>
                <div class="input-row"><label>TORCH优生五项</label> 
                     <select id="v_torch">
                        <option value="0">正常</option>
                        <option value="1">异常</option>                      
                    </select></div>                   
                <div class="input-row"><label>地中海贫血</label> 
                    <select id="v_thalassemia">
                        <option value="0">否</option>
                        <option value="1">是</option>                      
                    </select></div>                                           
                <div class="input-row"><label>生殖道感染 (白带/衣/支)</label>
                    <select id="v_vaginal">
                        <option value="0">全阴性</option>
                        <option value="1">阴道炎症</option>
                        <option value="2">衣原体阳性</option>
                        <option value="3">支原体阳性</option>
                        <option value="4">多重感染</option>                          
                    </select></div>
            </div>

            <div class="group-card">
                <div class="group-title">4. 遗传与感染史</div>
                <div class="input-row"><label>染色体</label>
                    <select id="v_chromosome">
                        <option value="0">正常</option>
                        <option value="1">异常</option>                      
                    </select></div>    
                <div class="input-row"><label>家族遗传风险</label>
                    <select id="v_genetic_diseases">
                        <option value="0">无遗传病史</option>
                        <option value="1">显性遗传病史</option>
                        <option value="2">隐性遗传风险</option>                        
                    </select></div>       
                <div class="input-row"><label>传染项 (HIV/肝炎/梅毒)</label>
                    <select id="v_infect">
                        <option value="0">全阴性</option>
                        <option value="1">HIV阳性(已控制)</option>
                        <option value="2">HIV阳性(未处理)</option>   
                        <option value="3">梅毒阳性(已控制)</option>
                        <option value="4">梅毒阳性(未控制)</option>                       
                        <option value="5">肝炎阳性(大三阳已控制)</option>
                        <option value="6">肝炎阳性(小三阳已控制)</option>
                        <option value="7">肝炎阳性(未控制)</option>
                    </select></div>
            </div>
  
            <div class="group-card">
                <div class="group-title">5. 个体特征</div>
                <div class="input-row"><label>PTG-A三代试管接受度</label>
                    <select id="v_pgt">
                        <option value="0">无偏好</option>
                        <option value="1">高度接受</option>
                        <option value="2">不接受</option>
                    </select>
                </div>
                <div class="input-row"><label>运动</label>
                    <select id="v_exercise">
                        <option value="0">经常运动</option>
                        <option value="1">适量运动</option>
                        <option value="2">不运动</option>
                    </select></div>
                <div class="input-row"><label>饮食</label>
                    <select id="v_diet">
                        <option value="0">规律</option>
                        <option value="1">不规律</option>
                    </select></div>
                <div class="input-row"><label>作息</label>
                    <select id="v_sleep">
                        <option value="0">规律</option>
                        <option value="1">不规律</option>
                    </select></div>
                <div class="input-row"><label>情绪</label>
                    <select id="v_mood">
                        <option value="0">稳定</option>
                        <option value="1">波动</option>
                    </select></div>
            </div>           

            <button class="btn-run" onclick="ClinicEngine.render()">生成深度临床评估报告</button>
        </div>
    </aside>

<main class="main-display">
    <div id="placeholder" style="margin-top:180px; color:#cbd5e1; text-align:center;">
        <p style="font-size:80px;">🩺</p>
        <p>基于临床准则提供 20+ 指标深度解读</p>
    </div>

    <div class="report-paper" id="report-paper" style="display: none;">
        <div class="report-header">
            <h1>ADSMed试管检查深度分析报告</h1>
            <p> 为  爱  而  生 ·  助  您  好  孕 </a></p>
        </div>

        <div id="report-dynamic-content"></div>

        <div id="report-footer-logo" class="report-footer-watermark">
             <div style="display: flex; flex-direction: column; align-items: center; opacity: 0.4; filter: grayscale(100%); margin-top: 10px; padding-top: 20px; ">
               <img src="https://adsmed.org/img/logo.png" alt="ADSMed Logo" style="height: 40px; width: auto; margin-bottom: 8px;">
               <span style="font-size: 12px; color: #64748b; letter-spacing: 2px;">ADSMed 生殖医学中心 · 专业支持</span>
             </div>
        </div>

        <div class="no-print" style="text-align: center; margin-top: 20px; padding-bottom: 20px;">
            <button onclick="ClinicEngine.save()" style="background:var(--med-blue); color:white; border:none; padding:15px 40px; border-radius:8px; cursor:pointer; font-weight:bold; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 12px rgba(44, 62, 80, 0.2);">
                保存并下载ADSMed评估报告
            </button>
        </div>
    </div>
</main>
</div>

<script>

    (function() {
        const AUTH_CODE_ENCODED = "d2Flc3puaHk="; 
        const STORAGE_KEY = "adsmed_authorized";
        if (sessionStorage.getItem(STORAGE_KEY) !== "true") {
            let input = prompt("该工具仅供内部使用，请输入授权码：");
            if (input && btoa(input) === AUTH_CODE_ENCODED) {
                sessionStorage.setItem(STORAGE_KEY, "true");
            } else {
                alert("授权码错误，无法访问。");
                document.body.innerHTML = "<h1>403 未授权访问</h1>";
                window.location.href = "/";
            }
        }
    })();


const ClinicEngine = (function() {
    
    const _get = (id) => document.getElementById(id).value;
    const _text = (id) => {
        const el = document.getElementById(id);
        return el.options ? el.options[el.selectedIndex].text : el.value;
    };
    const _num = (id) => parseFloat(_get(id)) || 0;

    

    const createRow = (name, val, detail, status) => `
        <tr>
            <td style="font-weight:bold; color:var(--med-blue); font-size:13.5px;">${name}</td>
            <td style="text-align:center; font-family: 'Monaco', monospace; color:#2d3748; font-weight:600;">${val}</td>
            <td style="text-align:center;">
                <span class="badge bg-${status}">${status.toUpperCase()}</span>
            </td>
            <td style="color:#4a5568; font-size:12.5px; line-height:1.6; padding-left:15px;">${detail}</td>
        </tr>`;

    
    const createSection = (title, rows) => `
        <div class="section-box">
            <div class="section-title">${title}</div>
            <table class="analysis-table">
                <thead>
                    <tr>
                        <th width="120">项目</th>
                        <th width="100" style="text-align:center;">数值</th>
                        <th width="80" style="text-align:center;">状态</th>
                        <th>临床深度评估与对策</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;

    return {
        render: function() {
            
            document.getElementById('placeholder').style.display = 'none';
            const paper = document.getElementById('report-paper');
            const dynamicContent = document.getElementById('report-dynamic-content'); 
            paper.style.display = 'block';
            
            
            
            dynamicContent.innerHTML = "";

            
            
            
            const age = _num('v_age');
            const weight = _num('v_weight');
            const height = _num('v_height');
            const bmi = (weight / Math.pow(height / 100, 2)).toFixed(1);
            const history = _get('s_history');
            const flow = _num('s_flow');

            let d1 = "";

            
            d1 += createRow("姓名", _get('v_name'), "身份唯一识别码。", 'ok');

            
            let ageDetail = "";
            let ageStatus = 'ok';
            if (age < 35) {
                ageDetail = "【适孕年龄】预期囊胚形成率及单次移植着床率较高。";
                ageStatus = 'ok';
            } else if (age >= 35 && age < 40) {
                ageDetail = "【高龄警戒】35岁后卵巢储备开始加速衰退。";
                ageStatus = 'warn';
            } else {
                ageDetail = "【高龄风险】卵子质量及数量双重下降，胚胎染色体异常率通常>60%。医学建议采用高效促排方案，并在遗传咨询指导下进行周期。";
                ageStatus = 'crit';
            }
            d1 += createRow("年龄", age + "岁", ageDetail, ageStatus);

            
            let bmiDetail = "";
            let bmiStatus = 'ok';
            if (bmi < 18.5) {
                bmiDetail = "【体重过低】可能存在下丘脑性排卵障碍风险，且移植后胎儿发育受限风险略升，建议适当补充营养。";
                bmiStatus = 'warn';
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                bmiDetail = "【理想状态】体内激素反馈机制稳定，有利于促排药物的吸收与卵泡均匀发育。";
                bmiStatus = 'ok';
            } else if (bmi >= 25 && bmi < 30) {
                bmiDetail = "【超重提醒】可能存在胰岛素抵抗风险。促排中 Gn 剂量需求往往增加，且胚胎种植率随 BMI 升高而呈下降趋势。";
                bmiStatus = 'warn';
            } else {
                bmiDetail = "【肥胖风险】显著增加排卵异常及妊娠期并发症风险。建议在周期前通过减重5-10%来改善盆腔微环境，提高获卵质量。";
                bmiStatus = 'crit';
            }
            d1 += createRow("BMI指数", bmi, bmiDetail, bmiStatus);

            
            d1 += createRow("血型", _text('s_blood'), "对于 Rh 阴性等稀有血型，需提前评估妊娠期母婴血型不合风险。", 'ok');

            
            let historyDetail = "";
            let historyStatus = "ok"; 

            const historyLabel = _text('s_history'); 
            switch (history) {
              case '3': 
               historyStatus = "crit"; 
               historyDetail = "<b>原发性不孕。</b> 需重点排查子宫内膜种植窗（WOI）是否存在偏移、是否存在隐匿性子宫内膜炎（CD138）或免疫排斥因素。。";
            break;
        
              case '0': 
               historyStatus = "warn"; 
               historyDetail = "<b>容受性未验证：</b> 子宫内膜对胚胎的接受能力尚处于“黑盒”状态。建议在排卵期监测子宫内膜血流以评估种植潜能。";
            break;
        
              case '1':
              case '2': 
               historyStatus = "ok"; 
               const childCount = history === '1' ? "单次" : "多次";
               historyDetail = `<b>经产（分娩史：${childCount}）：</b> 既往成功分娩史是子宫内膜具备良好<b>胚胎容受性</b>的强有力证据。复苏移植成功率预期较好。注意排查随年龄增长可能出现的内膜息肉、肌腺症或剖宫产切口憩室。`;
            break;
        
            default:
               historyDetail = "需结合详细既往病史进一步评估。";
             }
            d1 += createRow("既往生育史", _text('s_history'), historyDetail, 'ok');

            
            let flowDetail = "";
            let flowStatus = 'ok';
            if (flow === 0) {
                flowDetail = "无流产史。子宫内膜基底层保护完好，无因刮宫导致的人为粘连风险。";
            } else if (flow === 1) {
                flowDetail = "有1次流产记录。需关注内膜修复情况，移植前确保内膜厚度 > 9mm 且三线征清晰。";
                flowStatus = 'ok';
            } else if (flow >= 2) {
                flowDetail = "【复发性流产(RSA)】高度警示！需系统筛查抗磷脂综合征（APS）、内分泌紊乱及夫妻双方外周血染色体，排除种植环境障碍。";
                flowStatus = 'crit';
            }
            d1 += createRow("流产史分析", _text('s_flow'), flowDetail, flowStatus);

            
            
            
            const afc = _num('v_afc');
            const amh = _num('v_amh');
            const fsh = _num('v_fsh');
            const lh = _num('v_lh');
            const e2 = _num('v_e2');
            const prl = _num('v_prl');
            const ultra = _get('v_ultra');

            let d2 = "";

            
            let afcDetail = "";
            let afcStatus = 'ok';
            if (afc < 5) {
                afcDetail = "【波塞冬1/2类风险】窦卵泡数极低，提示单周期促排可采集卵子数量严重不足。临床对策：建议采用微刺激或拮抗剂方案，重点关注卵子获能性而非数量。";
                afcStatus = 'crit';
            } else if (afc > 15) {
                afcDetail = "【高反应预警】窦卵泡发育旺盛。促排中需严密监测，预防卵巢过度刺激综合征（OHSS），建议使用低剂量Gn启动并考虑全胚冷冻。";
                afcStatus = 'warn';

                                ${riskFactors.length ? riskFactors.map(f => `<li>${f}</li>`).join('') : '<li>暂无中度风险项</li>'}
                            </ul>
                        </div>
                        <div style="flex:1; background:#fff5f5; padding:15px; border-radius:8px;">
                            <strong style="color:#e74c3c;">🚨 高危因素</strong>
                            <ul style="margin:10px 0 0 0; padding-left:18px; font-size:12px; color:#2d3748;">
                                ${criticalFactors.length ? criticalFactors.map(f => `<li>${f}</li>`).join('') : '<li>未检出移植禁忌项</li>'}
                            </ul>
                        </div>
                    </div>

                    <div style="background:var(--soft-bg); padding:20px; border-radius:10px; margin-bottom:20px;">
                        <h4 style="margin-top:0; color:var(--med-blue);">📅 总体试管策略</h4>
                        <p style="font-size:13.5px; line-height:1.6; color:#4a5568;">
                            基于您的<strong>年龄(${age}岁)</strong>与<strong>AMH(${amh}ng/mL)</strong>，当前生育潜能评估为：
                            <span style="color:var(--med-pink); font-weight:bold;">
                                ${amh < 1.1 ? '卵巢储备功能减退 (DOR)' : (amh > 4.5 ? '卵巢高反应人群 (PCOS倾向)' : '卵巢储备良好')}
                            </span>。<br>
                            针对您的个体情况，临床建议采取 <strong>${protocolTitle}</strong>。
                        </p>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div style="border:1px solid #e2e8f0; padding:15px; border-radius:8px;">
                            <strong style="color:var(--med-blue); display:block; margin-bottom:8px;">1. 促排方案细节</strong>
                            <div style="font-size:12.5px; color:#64748b;">${protocolDetail}</div>
                        </div>
                        <div style="border:1px solid #e2e8f0; padding:15px; border-radius:8px;">
                            <strong style="color:var(--med-blue); display:block; margin-bottom:8px;">2. 移植准入建议</strong>
                            <div style="font-size:12.5px; color:#64748b;">
                                ${criticalFactors.some(f => f.includes('TSH') || f.includes('宫腔') || f.includes('感染')) 
                                    ? '🚩 <span style="color:red">建议推迟移植</span>。必须先处理高危拦截指标（如TSH调控、宫腔镜手术或抗感染治疗）。' 
                                    : '🟢 <span style="color:green">准予移植计划</span>。目前土壤环境优良，可根据囊胚培养结果择期安排复苏移植。'}
                            </div>
                        </div>
                    </div>

                    <div style="margin-top:15px; font-size:11px; color:#94a3b8; text-align:center; border-top:1px dashed #e2e8f0; padding-top:10px;">
                        * 本报告基于 ADSMed 临床算法生成，仅供专家参考，具体诊疗请遵医嘱。
                    </div>
                </div>`;

            
            
            dynamicContent.innerHTML = fullHtml + advice;

            document.getElementById('placeholder').style.display = 'none';
            paper.style.display = 'block';

            if(window.innerWidth < 900) { paper.scrollIntoView({ behavior: 'smooth' }); }            
        },

        save: function() {
           const paper = document.getElementById('report-paper');
           const noPrintBtn = paper.querySelector('.no-print');
    
        
         if(noPrintBtn) noPrintBtn.style.display = 'none';

         html2canvas(paper, { 
         scale: 2,
         useCORS: true,
         backgroundColor: "#ffffff" 
         }).then(canvas => {
         const link = document.createElement('a');
         link.download = `ADSMed_Report_${new Date().getTime()}.jpg`;
         link.href = canvas.toDataURL("image/jpeg", 0.95);
         link.click();
        
        
         if(noPrintBtn) noPrintBtn.style.display = 'block';
         });
    }


    };
})();
</script>
</body>
</html>
